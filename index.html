<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parametric Vectors</title>
<style>
:root { --bg: #f6f5f2; --panel: #fff; --text: #1f2328; --muted: #6a6f76; --border: #d9d6cf; --accent: #b5562a; }
@media (prefers-color-scheme: dark) { :root { --bg: #17191c; --panel: #212428; --text: #e6e6e3; --muted: #9aa0a6; --border: #3a3e44; --accent: #e07a4a; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px; }
h1 { margin: 0 0 4px; font-size: 24px; }
p.sub { color: var(--muted); margin: 0 0 24px; }
a.tool { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; color: inherit; text-decoration: none; }
a.tool:hover { border-color: var(--accent); }
a.tool strong { color: var(--accent); }
a.tool span { display: block; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Parametric Vectors</h1>
  <p class="sub">Small browser tools that generate parametric SVG/DXF files for laser and CNC cutting.</p>
  <a class="tool" href="spherical-waffle-shelf/">
    <strong>Spherical Waffle Shelf</strong>
    <span>Interlocking plywood shelf shaped like half an ellipsoid. Set the size, shelf and divider counts, material and machine, then download cut sheets.</span>
  </a>
</main>
</body>
</html>
